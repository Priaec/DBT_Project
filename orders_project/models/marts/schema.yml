version: 2

models:
  - name: dim_customers
    description: One row per customer with everything we know about them (names, email, region, gender).
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null
      - name: region
        description: Sales region the customer belongs to.
        data_tests:
          - not_null
      - name: gender
        description: female, male, or unknown.

  - name: customer_revenue
    description: One row per customer with their region, gender, completed orders and total revenue.
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null
      - name: total_revenue
        description: Sum of completed order amounts, in dollars.
  
  - name: daily_sales
    description: 'One row per day with order counts, completed revenue and a running total.'
    columns:
      - name: order_date
        data_tests:
          - unique
          - not_null
      - name: revenue
        data_tests:
          - not_null

  - name: daily_sales_all_days
    description: 'One row per day with order counts, completed revenue and a running total in the entire window.'
    columns:
      - name: sales_date
        data_tests:
          - unique
          - not_null
      - name: revenue
        data_tests:
          - not_null